<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Habit Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Mobile overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>

    <aside id="sidebar" class="sidebar" aria-label="Navigatie">
      <div class="sidebar-header">
        <!-- Brand/title click => Dashboard -->
        <button id="brandBtn" class="brand-btn" type="button" title="Ga naar dashboard" aria-label="Ga naar dashboard">
          <div class="brand">
            <div class="brand-title">Habits</div>
            <div class="brand-subtitle">Habit Tracker</div>
          </div>
        </button>

        <button id="addFolderBtn" class="icon-btn" title="Nieuw mapje" aria-label="Nieuw mapje">+</button>
      </div>

      <nav id="sidebarNav" class="nav"></nav>

      <div class="sidebar-footer">
        <button id="exportBtn" class="link-btn" type="button">⬇️ Export JSON</button>
        <button id="importBtn" class="link-btn" type="button">⬆️ Import JSON</button>
        <input id="importFile" type="file" accept="application/json" hidden />
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="Open menu" title="Menu">☰</button>
          <div class="breadcrumbs" id="breadcrumbs"></div>
        </div>

        <div class="topbar-actions">
          <!-- Dashboard view => "Vandaag", Sheet view => "🏠 Home" -->
          <button id="topRightBtn" class="btn" type="button">Overview</button>
        </div>
      </header>

      <section id="view" class="view"></section>
    </main>
  </div>

  <!-- ES Modules entry -->
  <script type="module" src="app.js"></script>
</body>
</html>
